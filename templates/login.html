{% extends "base.html" %}
{% block title %}Sign In - Studioza{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="glass-card max-w-md w-full rounded-[2rem] p-8 md:p-12 shadow-2xl relative overflow-hidden">
        <!-- Decorative Glow -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-indigo-500/20 rounded-full mix-blend-screen filter blur-[40px]"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-purple-500/20 rounded-full mix-blend-screen filter blur-[40px]"></div>
        
        <div class="text-center relative z-10">
            <h2 class="mt-2 text-3xl font-black text-white tracking-tight">Welcome Back</h2>
            <p class="mt-2 text-sm text-slate-400 font-medium">Sign in to your account</p>
        </div>

        <form class="mt-10 space-y-6 relative z-10" action="{{ url_for('login') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="login_id" class="block text-sm font-bold text-slate-300 ml-1 mb-1">Email or Phone Number</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-slate-500"></i>
                        </div>
                        <input id="login_id" name="login_id" type="text" required class="appearance-none relative block w-full px-3 py-3.5 pl-11 bg-slate-900/50 border border-slate-700 placeholder-slate-500 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition-all" placeholder="Enter email or phone">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-bold text-slate-300 ml-1 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-500"></i>
                        </div>
                        <input id="password" name="password" type="password" required class="appearance-none relative block w-full px-3 py-3.5 pl-11 bg-slate-900/50 border border-slate-700 placeholder-slate-500 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm transition-all" placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white btn-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-sign-in-alt text-indigo-300 group-hover:text-indigo-200"></i>
                    </span>
                    Sign In
                </button>
            </div>
        </form>
        
        <div class="mt-8 text-center relative z-10 border-t border-slate-700 pt-6">
            <p class="text-sm text-slate-400 font-medium">
                Don't have an account? 
                <a href="{{ url_for('register') }}" class="font-bold text-indigo-400 hover:text-indigo-300 transition-colors">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
